# Environment variables: `os.environ["A"]`, `os.environ.get("A")`, `os.environ.setdefault("A", …)`, `os.environ.pop("A", …)`, `os.getenv("A")` and each field of a pydantic settings class, named after the field (behind the class's `env_prefix`) in upper case, or after its `env` (pydantic 1), `validation_alias` or `alias` when it has a literal one, which is the name as it stands, with no prefix. Always on.
#
# A write serves the variable, so that a test setup that sets `API_URL` reaches the code that reads it: `os.environ["A"] = "x"`, `os.environ["B"] += "y"`, `del os.environ["C"]`, `os.putenv("D", "x")`, `os.unsetenv("E")`, `monkeypatch.setenv("F", "x")` and `monkeypatch.delenv("G")`. `setdefault` and `pop` give the variable back, so they call it and serve it. `os.environ.update(…)` and `os.environ |= …` are not read.
#
# Only a class that names `BaseSettings` as a base is a settings class: a class that derives from another settings class is not read, which the provides say. A pattern that starts with `*` meets a base as written only, so the two libraries that define `BaseSettings` are named for a class that imports it under another name.
name = "env"
language = "python"

[[calls]]
callee = [
  "os.environ.get",
  "environ.get",
  "os.environ.setdefault",
  "environ.setdefault",
  "os.environ.pop",
  "environ.pop",
  "os.getenv",
  "getenv",
]
kind = "env"
role = "calls"
key = "$arg1"

[[calls]]
callee = [
  "os.environ.setdefault",
  "environ.setdefault",
  "os.environ.pop",
  "environ.pop",
  "os.putenv",
  "putenv",
  "os.unsetenv",
  "unsetenv",
  "monkeypatch.setenv",
  "monkeypatch.delenv",
]
kind = "env"
role = "serves"
key = "$arg1"

[[chains]]
root = ["os.environ", "environ"]
kind = "env"
role = "calls"
written = "serves"
segments = 1

[[assigns]]
target = "*"
class = ["BaseSettings", "*.BaseSettings", "pydantic_settings.BaseSettings", "pydantic.BaseSettings"]
kind = "env"
role = "calls"
key = "$env|$validation_alias|$alias|$callee"
