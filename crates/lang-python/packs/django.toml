# Django routes and tables. A `path()` entry serves its route under any method; `path("api/", include("app.urls"))` is not a route but a mount, which the connector reads and `link` composes across files. `re_path()` patterns are regular expressions, not paths, and are only read as mounts. A table is named by `db_table` in the `Meta` of a model; the target is written with the classes around the name, so `db_table` anywhere else is not one.
name = "django"
language = "python"
detect = ["django"]

[[calls]]
callee = ["path", "django.urls.path", "urls.path"]
kind = "http"
role = "serves"
key = "$arg1|$route"

[[assigns]]
target = "*.Meta.db_table"
kind = "table"
role = "declares"
key = "$arg1"
