# Prisma: a model method called on the client names the model's table.
name = "prisma"
language = "ts"
detect = ["@prisma/client"]

[[chains]]
root = ["prisma", "this.prisma", "this.prismaService", "ctx.prisma", "ctx.db", "this.db", "db", "tx"]
root_types = ["PrismaClient", "PrismaService", "Prisma.TransactionClient"]
kind = "table"
role = "calls"
segments = 1
terminals = [
  "findMany",
  "findFirst",
  "findFirstOrThrow",
  "findUnique",
  "findUniqueOrThrow",
  "create",
  "createMany",
  "createManyAndReturn",
  "update",
  "updateMany",
  "upsert",
  "delete",
  "deleteMany",
  "count",
  "aggregate",
  "groupBy",
]

# A file that uses a name it imports from the client as a value reads that table, and one that only types it does not: tsc reports what a model change breaks in a type, and the chain rules above find the files that query the table.
[[imports]]
from = "@prisma/client"
kind = "table"
role = "calls"
except = ["Prisma", "PrismaClient", "PrismaPromise", "$Enums"]
