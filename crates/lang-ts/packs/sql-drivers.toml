# SQL drivers: a query given as a string, a template or an object, a template tagged sql, or a call on a value, names the tables it reads.
name = "sql-drivers"
language = "ts"
detect = [
  "pg",
  "mysql",
  "mysql2",
  "better-sqlite3",
  "sqlite3",
  "@neondatabase/serverless",
  "mssql",
  "@libsql/client",
  "@planetscale/database",
  "oracledb",
  "sequelize",
  "postgres",
  "@vercel/postgres",
]

# A query given as a string or a template.
[[embeds]]
callee = [
  "*.query",
  "*.*.query",
  "*.*.*.query",
  "*.execute",
  "*.*.execute",
  "*.*.*.execute",
  "*.prepare",
  "*.*.prepare",
  "*.*.*.prepare",
  "*.exec",
  "*.*.exec",
  "*.*.*.exec",
]
lang = "sql"
computed = "placeholder"

# The same callees for a query held in an object, which a driver takes under `sql` or under `text`.
[[embeds]]
callee = [
  "*.query",
  "*.*.query",
  "*.*.*.query",
  "*.execute",
  "*.*.execute",
  "*.*.*.execute",
  "*.prepare",
  "*.*.prepare",
  "*.*.*.prepare",
  "*.exec",
  "*.*.exec",
  "*.*.*.exec",
]
lang = "sql"
text = "$arg1.sql"
computed = "placeholder"

[[embeds]]
callee = [
  "*.query",
  "*.*.query",
  "*.*.*.query",
  "*.execute",
  "*.*.execute",
  "*.*.*.execute",
  "*.prepare",
  "*.*.prepare",
  "*.*.*.prepare",
  "*.exec",
  "*.*.exec",
  "*.*.*.exec",
]
lang = "sql"
text = "$arg1.text"
computed = "placeholder"

# A template tagged `sql`, as `postgres`, `@neondatabase/serverless` and `@vercel/postgres` write it.
[[embeds]]
callee = ["sql", "*.sql", "sql.unsafe"]
lang = "sql"
computed = "placeholder"
