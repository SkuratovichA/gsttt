# Environment variables, read from the process or from the bundler, and set in a test: `process.env.A`, `process.env["B"]`, `import.meta.env.C`, each name destructured from `process.env`, and `vi.stubEnv("D", …)`.
#
# A read calls the variable. A write serves it, so that a test setup that sets `API_URL` reaches the code that reads it: `process.env.A = "x"`, `process.env.B ??= "x";`, `delete process.env.C` and `vi.stubEnv("D", "x")`. An assignment that gives a value (`const url = (process.env.E ??= "x")`) reads and serves. `Object.assign(process.env, …)`, `jest.replaceProperty(process.env, …)` and `process.env = {…}` are not read.
name = "env"
language = "ts"

[[chains]]
root = ["process.env", "import.meta.env"]
kind = "env"
role = "calls"
written = "serves"
segments = 1

[[calls]]
callee = ["vi.stubEnv"]
kind = "env"
role = "serves"
key = "$arg1"
