# axios: calls on the default client, on a client made by axios.create (its baseURL is the prefix), axios(config) and request(config).
name = "axios"
language = "ts"
detect = ["axios"]
relative_without_base = "rooted"

[[calls]]
callee = [
  "axios.get",
  "axios.post",
  "axios.put",
  "axios.patch",
  "axios.delete",
  "axios.head",
  "axios.options",
]
kind = "http"
role = "calls"
key = "$arg1"
method = "$callee"

[[calls]]
callee = [
  "*.get",
  "*.post",
  "*.put",
  "*.patch",
  "*.delete",
  "*.head",
  "*.options",
  "*.*.get",
  "*.*.post",
  "*.*.put",
  "*.*.patch",
  "*.*.delete",
  "*.*.head",
  "*.*.options",
]
kind = "http"
role = "calls"
key = "$arg1"
method = "$callee"
receiver = { from = "axios.create", key = "$arg1.baseURL" }

[[calls]]
callee = "axios"
kind = "http"
role = "calls"
key = "$arg1.url|$arg1"
method = "$arg1.method|$arg2.method"

[[calls]]
callee = "axios.request"
kind = "http"
role = "calls"
key = "$arg1.url"
method = "$arg1.method"

[[calls]]
callee = [
  "*.request",
  "*.*.request",
]
kind = "http"
role = "calls"
key = "$arg1.url"
method = "$arg1.method"
receiver = { from = "axios.create", key = "$arg1.baseURL" }
