[package]
name = "gsttt"
description = "What a code change affects, across files, packages and languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gsttt-config.workspace = true
gsttt-contracts.workspace = true
gsttt-core.workspace = true
gsttt-lang-python.workspace = true
gsttt-lang-rust.workspace = true
gsttt-lang-ts.workspace = true
gsttt-mcp.workspace = true
anstream.workspace = true
anstyle.workspace = true
camino.workspace = true
clap.workspace = true
clap_complete.workspace = true
faster-hex.workspace = true
jiff.workspace = true
miette = { workspace = true, features = ["fancy"] }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gsttt-core = { workspace = true, features = ["testing"] }
gsttt-scenario.workspace = true
insta.workspace = true
proptest.workspace = true
# A pseudo-terminal, so that the tests can answer the prompt of `config trust` the way a person does.
rustix = { workspace = true, features = ["fs", "pty"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
