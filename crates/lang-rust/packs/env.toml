# Environment variables, which every project reads through the standard library whether or not it depends on a crate for it: `env::var("A")`, `std::env::var_os("B")`, the macros `env!("C")` and `option_env!("D")`, `dotenvy::var("E")`, and a clap argument that falls back to a variable: `#[arg(long, env = "F")]`.
#
# Setting or removing a variable serves it, so that a test setup that sets `API_URL` reaches the code that reads it: `env::set_var("G", …)`, `std::env::set_var("H", …)`, `env::remove_var("I")` and `std::env::remove_var("J")`. A call inside `unsafe { … }`, which edition 2024 requires, is read like any other.
name = "env"
language = "rust"

[[calls]]
callee = [
  "env.var",
  "env.var_os",
  "std.env.var",
  "std.env.var_os",
  "dotenvy.var",
  "env!",
  "std.env!",
  "option_env!",
  "std.option_env!",
]
kind = "env"
role = "calls"
key = "$arg1"

[[calls]]
callee = [
  "env.set_var",
  "std.env.set_var",
  "env.remove_var",
  "std.env.remove_var",
]
kind = "env"
role = "serves"
key = "$arg1"

[[decorators]]
decorator = ["arg", "clap"]
kind = "env"
role = "calls"
key = "$env"
