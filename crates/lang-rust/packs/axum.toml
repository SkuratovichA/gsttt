# axum: `Router::new().route("/bookings/{id}", get(show).delete(destroy))` serves one route per method of the method router, and `any(..)` serves every method. `nest` and `merge` carry a prefix across routers; the connector follows them when it links files, so they need no rule here. `route` is a method of other types too, so it counts only on a receiver the same file shows to be a router: made by `Router::new()` or declared with the type `Router`.
name = "axum"
language = "rust"
detect = ["axum"]

[[calls]]
callee = "*.route"
kind = "http"
role = "serves"
key = "$arg1"
method = "$arg2.method"
receiver = { from = ["axum.Router.new", "Router.new", "axum.Router.default", "Router.default"] }
