# sea-orm: an entity names its table in an attribute.
name = "sea_orm"
language = "rust"
# Cargo takes `-` and `_` in a package name to be the same, so a manifest may spell either.
detect = ["sea-orm", "sea_orm"]

[[decorators]]
decorator = "sea_orm"
kind = "table"
role = "declares"
key = "$table_name"
