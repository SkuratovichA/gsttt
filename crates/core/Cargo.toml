[package]
name = "gsttt-core"
description = "The language-independent half of gsttt: the file and contract graph, connectors, the index and the queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
camino = { workspace = true, features = ["serde1"] }
fixedbitset.workspace = true
foldhash.workspace = true
gix = { workspace = true, features = ["sha1", "dirwalk", "revision", "parallel"] }
globset.workspace = true
ignore.workspace = true
jiff.workspace = true
memchr.workspace = true
rayon.workspace = true
rkyv.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true

[features]
# Indexes written as lists of facts, for tests. The tests of this crate turn it on through the dev-dependency on itself below, and the crates that put questions to an index turn it on in their own.
testing = []

[dev-dependencies]
gsttt-core = { path = ".", features = ["testing"] }
gsttt-scenario.workspace = true
insta.workspace = true
proptest.workspace = true
similar-asserts.workspace = true

[lints]
workspace = true
