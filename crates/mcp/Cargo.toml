[package]
name = "gsttt-mcp"
description = "The gsttt MCP server over stdio: named tools that answer with coverage and staleness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gsttt-core.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
gsttt-core = { workspace = true, features = ["testing"] }
gsttt-scenario.workspace = true
insta.workspace = true
proptest.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
