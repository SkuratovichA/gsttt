# Environment variables: `os.Getenv("A")` and `os.LookupEnv("A")`. A write serves the variable, so that a test setup that sets `API_URL` reaches the code that reads it: `os.Setenv("A", "x")` and `os.Unsetenv("A")`. Always on.
name = "env"
language = "go"

[[calls]]
callee = ["os.Getenv", "os.LookupEnv"]
kind = "env"
role = "calls"
key = "$arg1"

[[calls]]
callee = ["os.Setenv", "os.Unsetenv"]
kind = "env"
role = "serves"
key = "$arg1"
