[package]
name = "xtask"
description = "Repository tasks: the spec gate with the list of changes ready to archive, the version, packaging and notes of a release, and the checks of the repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# Packing a release: the archive is written in this process so that it is the same on every machine, whatever `tar` and `sha256sum` the machine has.
flate2.workspace = true
gsttt-spec.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde.workspace = true
serde_json.workspace = true
# The workflows are parsed to tell a real `uses` from text that looks like one.
serde_norway.workspace = true
sha2.workspace = true
syn = { workspace = true, features = ["visit"] }
tar.workspace = true
toml.workspace = true
xshell.workspace = true

[dev-dependencies]
gsttt-scenario.workspace = true
tempfile.workspace = true

[lints]
workspace = true
