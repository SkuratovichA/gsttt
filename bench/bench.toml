# What `cargo xtask bench` measures: public repositories pinned at a release tag and the full commit the tag points at, and the tools pinned at a version. Resolved on 28.10.2026, with `git ls-remote --tags` for the repositories (the commit of an annotated tag is the peeled one) and the release pages for the tools. gsttt is not pinned: it is the binary the task is given.

# vite, a TypeScript monorepo; it has no tsconfig.json at its root, so the tsconfig of its main package is named. Without a tsconfig madge follows the imports of vite's TypeScript files into `.vue` and `.svelte` files and stops on a syntax error (its `--exclude` is applied after the traversal and does not help); with one it finishes. dependency-cruiser is not given it: it resolves a tsconfig below the root against the wrong directory, and it reads vite without one.
[[repository]]
name = "vite"
url = "https://github.com/vitejs/vite"
tag = "v8.3.5"
commit = "981f07fa4580fb88b333c4450431e4715d2a0b82"
language = "typescript"
tsconfig = "packages/vite/tsconfig.json"

# What the agent runs ask about vite: the functions of packages/vite (the other packages import vite through `dist`, which a checkout that is not built does not have), 4 questions about the files that refer to a function and 4 about the test files that break with it. vite pins pnpm 12.14.0 in its `packageManager` and the pnpm of a machine is another one, so the install runs that version through `pnpm dlx`; it skips lifecycle scripts, because vite's `preinstall` runs npx and the `postinstall` of its playwright-chromium downloads browsers into the Playwright cache of the user and prunes the ones it finds there, and the unit tests need none of that. The unit tests are the files under `__tests__` that `vitest.config.ts` includes, run from the root.
[repository.agents]
scope = "packages/vite"
users = 4
tests = 4
install = ["pnpm", "dlx", "pnpm@12.14.0", "install", "--frozen-lockfile", "--ignore-scripts"]
# Vitest does not start until the package this repository is named after is built: its config imports vite, which resolves to packages/vite/dist, and so do the tests of the other packages, so a throw in a function of vite reaches them only through a bundle built with it. The draw builds once after the install and the oracle builds again right before every run of the tests. The bundle alone builds in a second, and the types are not needed.
build = ["pnpm", "--filter", "vite", "run", "build-bundle"]
test = ["pnpm", "exec", "vitest", "run"]

# excalidraw, a TypeScript application with a tsconfig.json at its root.
[[repository]]
name = "excalidraw"
url = "https://github.com/excalidraw/excalidraw"
tag = "v0.18.1"
commit = "a2ec2889babf7d2295469c6d90ebe77fae57df84"
language = "typescript"
tsconfig = "tsconfig.json"

# What the agent runs ask about excalidraw: its whole checkout, since its tsconfig maps its packages to their sources, and only questions about the files that refer to a function, because it installs with yarn and nothing but its lockfile pins what its tests run against.
[repository.agents]
scope = "."
users = 4

# hoppscotch, a TypeScript monorepo whose backend is NestJS with code-first GraphQL resolvers and whose client packages send GraphQL documents: the repository the agent questions of the kind `clients` are drawn from. It is MIT-licensed. amplication was the other candidate: its server and its client are both there, but its licence is mixed and a folder of it (`ee`) is under another one. The tsconfig is the backend's; hoppscotch has none at its root. gsttt reads the whole checkout for the speed benchmark like it reads any other repository.
[[repository]]
name = "hoppscotch"
url = "https://github.com/hoppscotch/hoppscotch"
tag = "2026.10.0"
commit = "39d25650bdb4e86464b2cd69174c567b86f57892"
language = "typescript"
tsconfig = "packages/hoppscotch-backend/tsconfig.json"

# What the agent runs ask about hoppscotch: only questions of the kind `clients`, over `packages`. The `users` questions are not asked: the language service refuses the client packages (they import a `./graphql` that code generation writes and git does not track), so the oracle of `clients` reads the TypeScript below the tsconfig only, and takes the GraphQL documents from the whole scope. The resolvers are classes under packages/hoppscotch-backend and 124 of their callees are methods of other classes; 112 of those are served by a field that between 1 and 30 files select, which are the candidates of the draw. There is no install: the oracle reads the sources.
[repository.agents]
scope = "packages"
clients = 6

# django, a Python project whose package grimp reads.
[[repository]]
name = "django"
url = "https://github.com/django/django"
tag = "6.1.2"
commit = "2212534bae393714e1e51db2341d4fd5545e19f6"
language = "python"
packages = ["django"]

# ripgrep, a Rust project.
[[repository]]
name = "ripgrep"
url = "https://github.com/BurntSushi/ripgrep"
tag = "15.2.0"
commit = "e89fff89ac9af12e8d4ce9d5fd07beb408ca730f"
language = "rust"

# The agent runs of `cargo xtask agents`, specified in `openspec/changes/add-agent-benchmarks/`: the model as the alias Claude Code takes, how many times every question is asked in every setup, the seed that orders the candidates of the questions (another seed draws other questions), the wall-clock limit of one run in seconds and its limit of turns.
[agents]
model = "sonnet"
repeats = 3
seed = "gsttt-agents-1"
seconds = 900
turns = 80

# dependency-cruiser, installed by pnpm into bench/tools/node.
[tools.dependency-cruiser]
version = "18.7.0"

# madge, installed by pnpm into bench/tools/node.
[tools.madge]
version = "8.0.0"

# typescript, installed beside the two Node tools so that they find their TypeScript parser; 5.9.3 is the newest release that both support (dependency-cruiser needs one below 7.0.0, madge asks for ^5.4.4).
[tools.typescript]
version = "5.9.3"

# typescript-language-server, installed beside TypeScript; 6.0.2 is what the TypeScript plugin of Claude Code runs on the machine this was pinned on, and it runs with the TypeScript above when it is told where its tsserver is (`initializationOptions.tsserver.path`).
[tools.typescript-language-server]
version = "6.0.2"

# graphql, installed beside TypeScript; the oracle of the questions of the kind `clients` parses the GraphQL documents of a checkout with it, 17.0.2 being the newest release on 30.10.2026.
[tools.graphql]
version = "17.0.2"

# grimp, installed by uv into the virtual environment bench/tools/python.
[tools.grimp]
version = "3.18"

# codebase-memory-mcp, downloaded as the release archive of the platform; a download URL is releases, then v<version>, then the file of the archive.
[tools.codebase-memory-mcp]
version = "0.12.1"
releases = "https://github.com/DeusData/codebase-memory-mcp/releases/download"

