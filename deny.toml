[graph]
all-features = false

# A crate with a security advisory fails the check.
[advisories]
ignore = []

# Only licenses that can be distributed with an Apache-2.0 binary.
[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of this workspace depend on each other by path and are never published.
allow-wildcard-paths = true

# Crates.io only: no other registry, no git dependency.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
