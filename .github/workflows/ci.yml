name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run of the one before it. A run on main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup 1.28 and later installs nothing by itself: this installs the toolchain, profile and components of rust-toolchain.toml.
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2,typos@1.51.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Every check runs even when one before it failed, so a run shows all that is wrong.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        env:
          NEXTEST_PROFILE: ci
        run: cargo nextest run --workspace
      - name: Spec gate
        if: ${{ !cancelled() }}
        run: cargo xtask spec
      - name: Repository check
        if: ${{ !cancelled() }}
        run: cargo xtask check
      - name: OpenSpec
        if: ${{ !cancelled() }}
        run: pnpm dlx @fission-ai/openspec@1.15.0 validate --all --strict --no-interactive
      - name: Dependencies
        if: ${{ !cancelled() }}
        run: cargo deny check
      - name: Typos
        if: ${{ !cancelled() }}
        run: typos

  # The jobs below release every green push to main. A push made by the archive workflow commits as github-actions[bot] and releases nothing.
  build:
    name: build ${{ matrix.target }}
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # The Linux builds are static (musl) and cross-compiled with zig as the C compiler, so one runner type builds both.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build: zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build: zigbuild
          - target: x86_64-apple-darwin
            os: macos-latest
            build: build
          - target: aarch64-apple-darwin
            os: macos-latest
            build: build
    steps:
      # The whole history, because the version of a release counts its commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: ${{ matrix.build == 'zigbuild' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - if: ${{ matrix.build == 'zigbuild' }}
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-zigbuild@0.24.0
      - name: Version
        id: version
        run: |
          version="$(cargo xtask version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          GSTTT_VERSION: ${{ steps.version.outputs.version }}
        run: cargo ${{ matrix.build }} --profile dist --target ${{ matrix.target }} --package gsttt
      - name: Package
        run: cargo xtask package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error

  publish:
    needs: [checks, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      # A rerun finds the release of its commit and only refreshes its files.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask version)"
          cargo xtask notes > notes.md
          if gh release view "v${version}" > /dev/null 2>&1; then
            gh release upload "v${version}" packages/* --clobber
          else
            gh release create "v${version}" packages/* --title "v${version}" --notes-file notes.md --target "${GITHUB_SHA}"
          fi
